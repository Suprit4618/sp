<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <!-- Crisp Ivory Cotton Fabric background -->
  <rect width="800" height="800" fill="#FAF8F5"/>
  
  <!-- Peter Pan Collar Curved Edge -->
  <path d="M100 150 C260 220, 540 220, 700 150 C740 400, 680 650, 400 680 C120 650, 60 400, 100 150 Z" fill="#FFFBF7" stroke="#EAB7CA" stroke-width="2"/>
  <!-- Scalloped stitch border along collar hem -->
  <path d="M140 240 C280 320, 520 320, 660 240" stroke="#C83F70" stroke-width="2" stroke-dasharray="6 4" fill="none"/>

  <!-- Embroidered Buttercup Garland along collar hemline -->
  <g transform="translate(400, 480)">
    <!-- Vine -->
    <path d="M-220 -80 C-100 40, 100 40, 220 -80" stroke="#8C9F83" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Central Buttercup flower -->
    <g transform="translate(0, 32)">
      <circle cx="0" cy="0" r="28" fill="#F6E6A3" stroke="#752743" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#FFC5A8" stroke="#752743" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#752743"/>
    </g>

    <!-- Flanking floral buds -->
    <g transform="translate(-110, 0)">
      <circle cx="0" cy="0" r="20" fill="#F5DCE5" stroke="#C83F70" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="8" fill="#C83F70"/>
    </g>
    <g transform="translate(110, 0)">
      <circle cx="0" cy="0" r="20" fill="#F5DCE5" stroke="#C83F70" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="8" fill="#C83F70"/>
    </g>

    <!-- Sage leafy sprigs -->
    <path d="M-50 20 C-65 5, -80 15, -75 25 C-65 35, -55 25, -50 20 Z" fill="#A9BBA0" stroke="#752743" stroke-width="1.2"/>
    <path d="M50 20 C65 5, 80 15, 75 25 C65 35, 55 25, 50 20 Z" fill="#A9BBA0" stroke="#752743" stroke-width="1.2"/>
    <path d="M-170 -40 C-190 -55, -205 -45, -200 -35 C-190 -25, -175 -35, -170 -40 Z" fill="#A9BBA0" stroke="#752743" stroke-width="1.2"/>
    <path d="M170 -40 C190 -55, 205 -45, 200 -35 C190 -25, 175 -35, 170 -40 Z" fill="#A9BBA0" stroke="#752743" stroke-width="1.2"/>
  </g>
</svg>

