<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" fill="none">
  <!-- Handmade deckled-edge paper background -->
  <rect width="600" height="900" fill="#FFF7F8"/>
  
  <!-- Bookmark boundary on textured cardstock -->
  <rect x="150" y="80" width="300" height="740" rx="16" fill="#FBF5ED" stroke="#EAB7CA" stroke-width="2"/>
  
  <!-- Tassel loop at top -->
  <circle cx="300" cy="140" r="10" fill="#FFF7F8" stroke="#752743" stroke-width="2"/>
  <path d="M300 130 C300 90, 300 60, 300 30" stroke="#C83F70" stroke-width="4" stroke-linecap="round"/>
  <rect x="290" y="20" width="20" height="25" rx="3" fill="#EAB7CA" stroke="#752743" stroke-width="1.5"/>

  <!-- Border stitching on bookmark -->
  <rect x="170" y="100" width="260" height="700" rx="10" stroke="#C83F70" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>

  <!-- Embroidered Monogram Letter 'L' entwined with wild roses -->
  <g transform="translate(300, 440)">
    <!-- Elegant Serif 'L' stem -->
    <path d="M-40 -140 L-10 -140 L-10 100 L60 100 L60 130 L-50 130 L-50 100 L-30 100 L-30 -110 L-50 -110 Z" fill="#752743"/>
    
    <!-- Entwined silk rose vine -->
    <path d="M-60 60 C-20 40, -40 -40, 10 -60 C30 -70, 40 -120, 20 -150" stroke="#8C9F83" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Blooming wild rose on monogram elbow -->
    <circle cx="-35" cy="50" r="22" fill="#F5DCE5" stroke="#C83F70" stroke-width="2"/>
    <circle cx="-35" cy="50" r="12" fill="#C83F70"/>
    <circle cx="-35" cy="50" r="4" fill="#F6E6A3"/>

    <!-- Little rosebud top -->
    <circle cx="20" cy="-140" r="12" fill="#EAB7CA" stroke="#C83F70" stroke-width="1.5"/>
    <circle cx="20" cy="-140" r="4" fill="#C83F70"/>

    <!-- Leaves -->
    <path d="M-10 -10 C5 -20, 15 -10, 5 0 Z" fill="#A9BBA0" stroke="#752743" stroke-width="1"/>
    <path d="M-50 0 C-65 -10, -60 10, -45 5 Z" fill="#A9BBA0" stroke="#752743" stroke-width="1"/>
  </g>
</svg>

