<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Warm Atelier Desk Atmosphere -->
  <rect width="800" height="600" fill="#FAF6F0"/>
  
  <!-- Desk surface line -->
  <rect x="0" y="380" width="800" height="220" fill="#F2EAE0"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#E3D7C8" stroke-width="2"/>

  <!-- Linen swatches and sketchbook -->
  <g transform="translate(180, 420) rotate(-6)">
    <rect x="-100" y="-120" width="220" height="160" rx="8" fill="#FFF7F8" stroke="#EAB7CA" stroke-width="2"/>
    <line x1="-80" y1="-90" x2="100" y2="-90" stroke="#F5DCE5" stroke-width="2"/>
    <line x1="-80" y1="-60" x2="60" y2="-60" stroke="#F5DCE5" stroke-width="2"/>
    <line x1="-80" y1="-30" x2="80" y2="-30" stroke="#F5DCE5" stroke-width="2"/>
    <!-- Pencil sketched botanical sprig in sketchbook -->
    <path d="M-40 -10 C-10 -40, 20 -20, 50 -60" stroke="#8D707B" stroke-width="1.8" stroke-dasharray="3 2" fill="none"/>
  </g>

  <!-- Wooden Embroidery Hoop resting on desk -->
  <g transform="translate(480, 360)">
    <circle cx="0" cy="0" r="140" stroke="#CDB099" stroke-width="14"/>
    <circle cx="0" cy="0" r="133" fill="#FFFBF7"/>
    <!-- In-progress needle and silk embroidery -->
    <path d="M-60 40 C-20 10, 20 60, 60 10" stroke="#C83F70" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="20" r="22" fill="#F5DCE5" stroke="#C83F70" stroke-width="2"/>
    <circle cx="0" cy="20" r="8" fill="#C83F70"/>
    <!-- Thread tail and needle -->
    <line x1="60" y1="10" x2="100" y2="-20" stroke="#752743" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="98" cy="-18" rx="1" ry="3" transform="rotate(-35 98 -18)" fill="#FFF" stroke="#752743" stroke-width="0.8"/>
  </g>

  <!-- Wooden Spools of Silk Thread -->
  <g transform="translate(700, 440)">
    <!-- Spool 1: Raspberry -->
    <rect x="-35" y="-50" width="30" height="50" rx="4" fill="#C83F70" stroke="#752743" stroke-width="1.5"/>
    <rect x="-40" y="-55" width="40" height="8" rx="2" fill="#CDB099" stroke="#752743" stroke-width="1.5"/>
    <rect x="-40" y="-3" width="40" height="8" rx="2" fill="#CDB099" stroke="#752743" stroke-width="1.5"/>

    <!-- Spool 2: Sage -->
    <rect x="15" y="-45" width="28" height="45" rx="4" fill="#A9BBA0" stroke="#752743" stroke-width="1.5"/>
    <rect x="10" y="-50" width="38" height="8" rx="2" fill="#CDB099" stroke="#752743" stroke-width="1.5"/>
    <rect x="10" y="-3" width="38" height="8" rx="2" fill="#CDB099" stroke="#752743" stroke-width="1.5"/>
  </g>

  <!-- Vintage Stork Embroidery Scissors -->
  <g transform="translate(320, 470) rotate(25)">
    <!-- Golden scissor handles -->
    <circle cx="-30" cy="0" r="14" stroke="#ECC55A" stroke-width="3" fill="none"/>
    <circle cx="30" cy="0" r="14" stroke="#ECC55A" stroke-width="3" fill="none"/>
    <!-- Stork body / blades -->
    <path d="M-15 0 L0 -60 L15 0" stroke="#ECC55A" stroke-width="4" fill="none"/>
    <line x1="0" y1="-60" x2="0" y2="-110" stroke="#752743" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Editorial caption -->
  <text x="50" y="80" font-family="'Cormorant Garamond', serif" font-size="28" font-style="italic" fill="#752743">The slow rhythm of the needle</text>
  <text x="50" y="110" font-family="'DM Sans', sans-serif" font-size="13" fill="#624A53" letter-spacing="1.5">ATELIER PINK LUNNA / SAMPLE WORKSPACE</text>
</svg>
