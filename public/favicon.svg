<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Delicate stitched circle -->
  <circle cx="32" cy="32" r="28" stroke="#EAB7CA" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Central miniature embroidered flower and needle -->
  <path d="M18 46 L42 22" stroke="#752743" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Needle eye -->
  <ellipse cx="41" cy="23" rx="1.5" ry="3" transform="rotate(-45 41 23)" fill="#FFF7F8" stroke="#752743" stroke-width="0.8"/>
  <!-- Pink silk thread swirling through -->
  <path d="M42 22 C48 16, 52 26, 44 32 C36 38, 38 48, 48 46" stroke="#C83F70" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- Little botanical petal -->
  <circle cx="28" cy="36" r="3.5" fill="#F5DCE5" stroke="#C83F70" stroke-width="1"/>
  <circle cx="24" cy="32" r="3" fill="#FFC5A8" stroke="#C83F70" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="3" fill="#F6E6A3" stroke="#C83F70" stroke-width="0.8"/>
</svg>
